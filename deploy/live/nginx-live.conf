# /etc/nginx/sites-available/arena-live
# live.llms-robot-arena.sndesign.it: TLS in front of the live server, websockets included.
map $http_upgrade $arena_connection {
    default upgrade;
    '' close;
}

upstream arena_live { server 127.0.0.1:8787; }

server {
    listen 80;
    listen [::]:80;
    server_name live.llms-robot-arena.sndesign.it;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name live.llms-robot-arena.sndesign.it;

    ssl_certificate /etc/letsencrypt/live/live.llms-robot-arena.sndesign.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.llms-robot-arena.sndesign.it/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://arena_live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $arena_connection;
        # A series of matches can take a few minutes; the socket pings itself.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
